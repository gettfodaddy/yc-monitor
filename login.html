<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2eee6">
  <title>Вход · cloudwatch</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{color-scheme:light;--ink:#302c26;--muted:#80796e;--line:#e6ded1;--paper:#f2eee6;--card:#fffdf9;--accent:#806846;--gold:#bb8748}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#e4dbc9 0,transparent 45%),radial-gradient(ellipse at 88% 82%,#e5dfd1 0,transparent 43%),var(--paper);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:36px;box-shadow:0 24px 80px #43351e14;animation:arrive .5s cubic-bezier(.2,.8,.2,1) both}.brand{display:flex;align-items:center;gap:11px;margin-bottom:36px;color:#302c26;font-weight:750;font-size:20px;letter-spacing:-.6px}.mark{height:38px;width:38px;display:grid;place-items:center;border-radius:12px;background:#3b3a35;color:#f2d5a5;font-size:14px;box-shadow:0 6px 16px #3b3a3525}.muted{font-weight:450;color:#8d8579}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#96764b;font-weight:750}h1{font-size:27px;line-height:1.15;letter-spacing:-.9px;margin:9px 0}p{color:var(--muted);line-height:1.55;font-size:13px;margin:0 0 26px}form{display:grid;gap:15px}label{display:grid;gap:7px;font-size:12px;font-weight:650}input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fffefa;color:var(--ink);font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s}input:focus{outline:0;border-color:#a78a61;box-shadow:0 0 0 4px #bb87481f}.submit{height:45px;margin-top:5px;border:0;border-radius:10px;background:#3b3a35;color:#fff8eb;font:inherit;font-size:13px;font-weight:650;cursor:pointer;transition:transform .18s,background .18s,box-shadow .18s}.submit:hover{transform:translateY(-2px);background:#514b3f;box-shadow:0 9px 20px #3b3a352b}.submit:active{transform:scale(.985)}.error{min-height:18px;color:#9c483d;font-size:12px}.foot{margin-top:24px;padding-top:17px;border-top:1px solid #eee8de;color:#a49a89;font-size:10px}@keyframes arrive{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body><main class="login-card"><div class="brand"><span class="mark">yc</span><span>cloud<span class="muted">watch</span></span></div><div class="eyebrow">ЗАЩИЩЁННАЯ ПАНЕЛЬ</div><h1>С возвращением</h1><p>Войдите, чтобы просмотреть аккаунты Yandex Cloud и состояние грантов.</p><form id="login-form"><label>Логин<input name="username" required autocomplete="username" autofocus></label><label>Пароль<input name="password" type="password" required autocomplete="current-password"></label><div class="error" id="login-error" role="alert"></div><button class="submit" id="login-submit" type="submit">Войти в панель <span aria-hidden="true">→</span></button></form><div class="foot">Доступ только для авторизованного пользователя</div></main><script>
const form=document.querySelector('#login-form'),error=document.querySelector('#login-error'),button=document.querySelector('#login-submit');form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';button.disabled=true;button.textContent='Проверяем доступ…';try{const response=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:form.elements.username.value,password:form.elements.password.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Не удалось войти.');const next=new URLSearchParams(location.search).get('next');location.replace(next&&next.startsWith('/')&&!next.startsWith('//')?next:'/accounts');}catch(e){error.textContent=e.message;button.disabled=false;button.innerHTML='Войти в панель <span aria-hidden="true">→</span>';}});
</script></body></html>
